name: Test
on:
  push:
    branches: ['main']
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install native media test dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: go test -short -count=1 -timeout=240s ./...
      - run: go vet ./...
      - run: go test -race -short -count=1 -timeout=240s .
      - run: bash scripts/test-modules.sh
      - run: go build -o /tmp/apteva-core ./cmd/apteva-core
      - run: /tmp/apteva-core --version
      - name: Test CGO-free media runtime on Alpine
        run: |
          CGO_ENABLED=0 go test -c -o /tmp/apteva-core-media.test .
          docker run --rm -v /tmp/apteva-core-media.test:/tests/core.test:ro alpine:3.21 \
            sh -ec 'apk add --no-cache gcompat opus; exec /tests/core.test -test.run "^(TestRealtimeNativeOpusRoundTrip|TestOpenAILiveWebRTCG711MediaAndControl|TestRealtimeRTP.*)$" -test.v -test.timeout=60s'
